{% set name = "python-fastjsonschema" %}
{% set version = "2.22.3" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name.split('-')[1][0] }}/{{ name.split('-')[1] }}/{{ name.split('-')[1] }}-{{ version }}.tar.gz
  sha256: 8330c91b027dcf941efcb7b1f0998515ff95d177ea15bbabdfe8671965620901

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv
  skip: true  # [py<310]

requirements:
  host:
    - python
    - pip
    - wheel
    - setuptools
  run:
    - python

test:
  source_files:
    - tests
  imports:
    - fastjsonschema
  commands:
    - pip check
    # benchmarks are excluded: they need pytest-benchmark from the upstream "devel" extra
    # and assert nothing about correctness, only throughput
    - cd tests && pytest -vv -m "not benchmark"
  requires:
    - pip
    - pytest

about:
  home: https://github.com/horejsek/python-fastjsonschema
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Fastest Python implementation of JSON schema
  description: |
    fastjsonschema implements validation of JSON documents by JSON schema. The
    library implements JSON schema drafts 04, 06 and 07. The main purpose is to
    have a really fast implementation.
  dev_url: https://github.com/horejsek/python-fastjsonschema
  doc_url: https://horejsek.github.io/python-fastjsonschema

extra:
  recipe-maintainers:
    - bollwyvl
